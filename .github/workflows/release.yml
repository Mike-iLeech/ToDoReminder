# Сборка EXE и публикация релиза по тегу vX.Y.Z.W.
# Автообновление в приложении берёт последний релиз отсюда, поэтому достаточно:
#   1) поднять APP_VERSION в version.py и дописать CHANGELOG.md;
#   2) git tag v2.7.0.0 && git push origin v2.7.0.0
# На каждый PR в main — те же тесты и сборка, но без публикации: EXE прикладывается
# к запуску как артефакт, а поломка сборки видна до тега, а не после.
name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

# серия пушей в один PR не собирает EXE несколько раз; запуски по тегам не отменяются
concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    env:
      # консоль раннера в cp1252: без UTF-8 print() кириллицы в тестах падает с UnicodeEncodeError
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      # Qt без экрана: тесты и tools/make_icon.py (QApplication) при сборке
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: python -m pip install -r requirements.txt

      - name: Версия в коде совпадает с тегом
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v", "V")
          $ver = python -c "from version import APP_VERSION; print(APP_VERSION)"
          if ($ver -ne $tag) { throw "version.py = $ver, а тег = $tag" }

      - name: Тесты
        run: python tests/run_tests.py

      - name: Сборка EXE
        shell: pwsh
        run: ./build.ps1

      - name: EXE как артефакт (PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ToDoReminder-pr${{ github.event.number }}
          path: dist/ToDoReminder.exe
          retention-days: 14

      - name: Публикация релиза
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          python tools/release_notes.py $tag notes.md
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/ToDoReminder.exe --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $tag --notes-file notes.md
          } else {
            gh release create $tag dist/ToDoReminder.exe --title "ToDo Reminder $($tag.TrimStart('v'))" --notes-file notes.md
          }
