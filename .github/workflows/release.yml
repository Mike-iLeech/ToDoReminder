# Сборка EXE и публикация релиза по тегу vX.Y.Z.W.
# Автообновление в приложении берёт последний релиз отсюда, поэтому достаточно:
#   1) поднять APP_VERSION в version.py и дописать CHANGELOG.md;
#   2) git tag v2.7.0.0 && git push origin v2.7.0.0
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: python -m pip install -r requirements.txt

      - name: Версия в коде совпадает с тегом
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v", "V")
          $ver = python -c "from version import APP_VERSION; print(APP_VERSION)"
          if ($ver -ne $tag) { throw "version.py = $ver, а тег = $tag" }

      - name: Тесты
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/run_tests.py

      - name: Сборка EXE
        shell: pwsh
        run: ./build.ps1

      - name: Публикация релиза
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          python tools/release_notes.py $tag notes.md
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/ToDoReminder.exe --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $tag --notes-file notes.md
          } else {
            gh release create $tag dist/ToDoReminder.exe --title "ToDo Reminder $($tag.TrimStart('v'))" --notes-file notes.md
          }
